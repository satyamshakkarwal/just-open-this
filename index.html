<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Diya 💖</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#fff0f5,#ffd6e7,#ffc2d1);
  overflow:hidden;
}

/* PARALLAX HEARTS */
.heart{
  position:absolute;
  width:10px;height:10px;
  background:#ff4d6d;
  transform:rotate(45deg);
  opacity:.2;
  animation:float 14s linear infinite;
}
.heart::before,.heart::after{
  content:"";
  position:absolute;
  width:10px;height:10px;
  background:#ff4d6d;
  border-radius:50%;
}
.heart::before{top:-5px;}
.heart::after{left:-5px;}

@keyframes float{
  0%{transform:translate3d(-10vw,100vh,0) rotate(45deg);}
  50%{transform:translate3d(10vw,40vh,0) rotate(45deg);}
  100%{transform:translate3d(-10vw,-10vh,0) rotate(45deg);}
}

/* SCREEN */
.screen{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  transform:scale(.95) translateY(20px);
  pointer-events:none;
  transition:all .6s cubic-bezier(.4,0,.2,1);
}
.screen.active{
  opacity:1;
  transform:scale(1) translateY(0);
  pointer-events:auto;
}

/* CARD */
.card{
  width:85%;
  max-width:340px;
  padding:28px;
  border-radius:22px;
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(18px);
  box-shadow:0 10px 40px rgba(0,0,0,0.1);
  text-align:center;
}

h2{color:#ff4d6d;}
p{font-size:14px;color:#444;line-height:1.5;}

/* BUTTON */
button{
  margin-top:18px;
  padding:12px 20px;
  border:none;
  border-radius:25px;
  background:linear-gradient(135deg,#ff4d6d,#ff85a2);
  color:white;
  font-size:14px;
  cursor:pointer;
  transition:.2s;
}
button:active{transform:scale(.92);}

/* WHATSAPP BUTTON */
.wa{
  background:linear-gradient(135deg,#25D366,#4BE081);
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 10px rgba(37,211,102,.4);}
  50%{box-shadow:0 0 25px rgba(37,211,102,.8);}
  100%{box-shadow:0 0 10px rgba(37,211,102,.4);}
}
</style>

</head>

<body>

<script>
for(let i=0;i<30;i++){
 let h=document.createElement("div");
 h.className="heart";
 h.style.left=Math.random()*100+"vw";
 h.style.animationDuration=(10+Math.random()*6)+"s";
 document.body.appendChild(h);
}
</script>

<div id="app"></div>

<script>
const texts = [
"hi diya… waittt 💭 don’t rush this",
"it’s been more than a month now… and somehow we got really close",
"and I won’t lie… this feels special to me",
"I like that we’re taking it slow… it actually makes it better",
"but I was thinking… 😌 maybe we move one tiny step forward",
"talking to you daily… yeah, it’s kind of my addiction now",
"and honestly… I just want more ways to annoy you",
"I know you’re not a call person… but the day we finally talk? yeah… that’s going to be special",
"I made this because… you’re way too special to me",
"and also because… I like finding new ways to make you smile and blush 😏"
];

let i=0;
const app=document.getElementById("app");

function render(){
 app.innerHTML = `
  <div class="screen active">
    <div class="card">
      <p>${texts[i]}</p>
      ${i<texts.length-1
        ? `<button onclick="next()">continue 💖</button>`
        : `<a href="https://wa.me/919205781271?text=hi%20babe">
            <button class="wa">message me 💖</button>
          </a>`}
    </div>
  </div>`;
}

function next(){
 i++;
 render();
}

render();
</script>

</body>
</html>
