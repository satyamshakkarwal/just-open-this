<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Diya 💖</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
  background:linear-gradient(135deg,#fff0f6,#ffd6e7,#ffc2d1);
}

/* LOVE CLOUDS */
.cloud{
  position:absolute;
  width:120px;
  height:60px;
  background:rgba(255,255,255,0.5);
  border-radius:50px;
  filter:blur(10px);
  animation:cloudMove 30s linear infinite;
}
@keyframes cloudMove{
  from{transform:translateX(-20vw);}
  to{transform:translateX(120vw);}
}

/* HEART RAIN */
.rain{
  position:absolute;
  font-size:14px;
  animation:rainFall linear infinite;
  opacity:.6;
}
@keyframes rainFall{
  to{transform:translateY(110vh);}
}

/* FLOATING HEARTS */
.heart{
  position:absolute;
  width:12px;height:12px;
  background:#ff4d6d;
  transform:rotate(45deg);
  opacity:.2;
  animation:float 14s linear infinite;
}
.heart::before,.heart::after{
  content:"";
  position:absolute;
  width:12px;height:12px;
  background:#ff4d6d;
  border-radius:50%;
}
.heart::before{top:-6px;}
.heart::after{left:-6px;}
@keyframes float{
  0%{transform:translate3d(-10vw,100vh,0) rotate(45deg);}
  50%{transform:translate3d(10vw,40vh,0) rotate(45deg);}
  100%{transform:translate3d(-10vw,-10vh,0) rotate(45deg);}
}

/* SCREEN */
.screen{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  transform:scale(.95) translateY(20px);
  pointer-events:none;
  transition:all .6s cubic-bezier(.4,0,.2,1);
}
.screen.active{
  opacity:1;
  transform:scale(1) translateY(0);
  pointer-events:auto;
}

/* CARD */
.card{
  width:88%;
  max-width:360px;
  padding:28px;
  border-radius:26px;
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(18px);
  box-shadow:0 15px 40px rgba(255,77,109,0.2);
  text-align:center;
}

/* TEXT */
p{
  font-size:15px;
  color:#444;
  line-height:1.6;
}

/* BUTTON */
button{
  margin-top:20px;
  padding:12px 22px;
  border:none;
  border-radius:30px;
  background:linear-gradient(135deg,#ff4d6d,#ff85a2);
  color:white;
  font-size:14px;
  cursor:pointer;
  transition:.2s;
}
button:active{transform:scale(.92);}

/* CTA */
.cta{
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 10px rgba(255,77,109,.4);}
  50%{box-shadow:0 0 25px rgba(255,77,109,.8);}
  100%{box-shadow:0 0 10px rgba(255,77,109,.4);}
}
</style>

</head>

<body>

<script>
// floating hearts
for(let i=0;i<30;i++){
 let h=document.createElement("div");
 h.className="heart";
 h.style.left=Math.random()*100+"vw";
 h.style.animationDuration=(10+Math.random()*6)+"s";
 document.body.appendChild(h);
}

// clouds
for(let i=0;i<3;i++){
 let c=document.createElement("div");
 c.className="cloud";
 c.style.top=Math.random()*50+"%";
 document.body.appendChild(c);
}

// heart rain
setInterval(()=>{
 let r=document.createElement("div");
 r.className="rain";
 r.innerText="💖";
 r.style.left=Math.random()*100+"vw";
 r.style.animationDuration=(2+Math.random()*2)+"s";
 document.body.appendChild(r);
 setTimeout(()=>r.remove(),4000);
},200);
</script>

<div id="app"></div>

<script>
const texts = [
{t:"hi diya… waittt 💭 don’t rush this",b:"stay here 👀"},
{t:"it’s been more than a month now… and somehow we got really close",b:"that’s true 😌"},
{t:"and I won’t lie… this feels special to me",b:"hmm okay"},
{t:"I like that we’re taking it slow… it actually makes it better",b:"makes sense 💖"},
{t:"but I was thinking… 😌 maybe we move one tiny step forward",b:"what step? 👀"},
{t:"talking to you daily… yeah, it’s kind of my addiction now",b:"you’re crazy 😭"},
{t:"and honestly… I just want more ways to annoy you",b:"try me 😏"},
{t:"I know you’re not a call person… but that day will be special",b:"we’ll see"},
{t:"I made this because… you’re way too special to me",b:"stop it 😭"},
{t:"and also because… I like making you smile and blush 😏",b:"okay enough"},
];

let i=0;
const app=document.getElementById("app");

function render(){
 app.innerHTML = `
  <div class="screen active">
    <div class="card">
      <p>${texts[i].t}</p>
      ${
        i<texts.length-1
        ? `<button onclick="next()">${texts[i].b}</button>`
        : `<a href="https://wa.me/919205781271?text=hi%20babe">
            <button class="cta">don’t press this 😌</button>
          </a>`
      }
    </div>
  </div>`;
}

function next(){
 i++;
 render();
}

render();
</script>

</body>
</html>
