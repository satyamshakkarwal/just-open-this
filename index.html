<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Diya 💖</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
  background:linear-gradient(180deg,#fff0f6,#ffc2d1);
}

/* HEART PROGRESS */
.heart-container{
  position:absolute;
  top:18px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:6px;
  z-index:10;
}
.heart-container span{
  font-size:18px;
  opacity:.25;
  transform:scale(.9);
  transition:.4s;
}
.heart-container span.active{
  opacity:1;
  transform:scale(1.2);
}

/* FLOAT HEARTS */
.heart{
  position:absolute;
  width:10px;height:10px;
  background:#ff4d6d;
  transform:rotate(45deg);
  opacity:.2;
  animation:float 14s linear infinite;
}
.heart::before,.heart::after{
  content:"";
  position:absolute;
  width:10px;height:10px;
  background:#ff4d6d;
  border-radius:50%;
}
.heart::before{top:-5px;}
.heart::after{left:-5px;}

@keyframes float{
  0%{transform:translate3d(-10vw,100vh,0) rotate(45deg);}
  50%{transform:translate3d(10vw,40vh,0) rotate(45deg);}
  100%{transform:translate3d(-10vw,-10vh,0) rotate(45deg);}
}

/* HEART RAIN */
.rain{
  position:absolute;
  font-size:14px;
  animation:rainFall linear infinite;
}
@keyframes rainFall{
  to{transform:translateY(110vh);}
}

/* SCREEN */
.screen{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  transform:translateY(20px);
  pointer-events:none;
  transition:.5s;
}
.screen.active{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}

/* CARD */
.card{
  width:90%;
  max-width:360px;
  padding:26px;
  border-radius:22px;
  background:rgba(255,255,255,0.6);
  backdrop-filter:blur(10px);
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  text-align:center;
}

p{
  font-size:15px;
  color:#444;
  line-height:1.6;
}

/* BUTTON */
button{
  margin-top:20px;
  padding:12px 22px;
  border:none;
  border-radius:30px;
  background:linear-gradient(135deg,#ff4d6d,#ff85a2);
  color:white;
  font-size:14px;
  cursor:pointer;
}
button:active{transform:scale(.92);}

/* CTA */
.cta{
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 10px rgba(255,77,109,.4);}
  50%{box-shadow:0 0 25px rgba(255,77,109,.8);}
  100%{box-shadow:0 0 10px rgba(255,77,109,.4);}
}

/* GRAFFITI BLAST */
.blast{
  position:fixed;
  font-size:18px;
  pointer-events:none;
  animation:blastAnim 1.4s ease-out forwards;
}
@keyframes blastAnim{
  0%{
    transform:translate(0,0) scale(1) rotate(0deg);
    opacity:1;
  }
  100%{
    transform:translate(var(--x),var(--y)) scale(0.2) rotate(720deg);
    opacity:0;
  }
}
</style>

</head>

<body>

<!-- HEART PROGRESS -->

<div class="heart-container" id="heart">
  <span>💖</span><span>💖</span><span>💖</span><span>💖</span><span>💖</span>
  <span>💖</span><span>💖</span><span>💖</span><span>💖</span><span>💖</span>
</div>

<div id="app"></div>

<script>
// floating hearts
for(let i=0;i<30;i++){
 let h=document.createElement("div");
 h.className="heart";
 h.style.left=Math.random()*100+"vw";
 h.style.animationDuration=(10+Math.random()*6)+"s";
 document.body.appendChild(h);
}

// heart rain
setInterval(()=>{
 let r=document.createElement("div");
 r.className="rain";
 r.innerText="💖";
 r.style.left=Math.random()*100+"vw";
 r.style.animationDuration=(2+Math.random()*2)+"s";
 document.body.appendChild(r);
 setTimeout(()=>r.remove(),4000);
},200);

// TEXT FLOW
const steps=[
"hi diya… waittt 💭 don’t rush this",
"it’s been more than a month now… and somehow we got really close",
"and I won’t lie… this feels special to me",
"I like that we’re taking it slow… it actually makes it better",
"but I was thinking… 😌 maybe we move one tiny step forward",
"talking to you daily… yeah, it’s kind of my addiction now",
"and honestly… I just want more ways to annoy you",
"I know you’re not a call person… but that day will be special",
"I made this because… you’re way too special to me",
"and also because… I like making you smile and blush 😏"
];

const btns=[
"stay 👀","true 😌","hmm","yeah 💖","what step 👀",
"crazy 😭","try me 😏","we’ll see","stop 😭","okay okay"
];

let i=0;
const app=document.getElementById("app");
const heart=document.getElementById("heart").children;

function updateHeart(){
 for(let j=0;j<=i;j++){
   heart[j].classList.add("active");
 }
}

// 💥 GRAFFITI HEART BLAST
function heartBlast(){
 const emojis=["💖","💕","💘","💝","💗","💓","❤️"];
 for(let k=0;k<80;k++){
   let b=document.createElement("div");
   b.className="blast";
   b.innerText=emojis[Math.floor(Math.random()*emojis.length)];
   b.style.left="50%";
   b.style.top="50%";

   let x=(Math.random()*600-300)+"px";
   let y=(Math.random()*600-300)+"px";

   b.style.setProperty("--x",x);
   b.style.setProperty("--y",y);

   b.style.fontSize=(14+Math.random()*20)+"px";

   document.body.appendChild(b);
   setTimeout(()=>b.remove(),1400);
 }
}

function render(){
 app.innerHTML=`
  <div class="screen active">
    <div class="card">
      <p>${steps[i]}</p>
      ${
        i<steps.length-1
        ? `<button onclick="next()">${btns[i]}</button>`
        : `<a href="https://wa.me/919205781271?text=hi%20babe">
            <button class="cta">just tap this once 😌</button>
          </a>`
      }
    </div>
  </div>`;
 updateHeart();

 // 🔥 TRIGGER BLAST ONLY ON FINAL STEP
 if(i===steps.length-1){
   heartBlast();
 }
}

function next(){
 i++;
 render();
}

render();
</script>

</body>
</html>
