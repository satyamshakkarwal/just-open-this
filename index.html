<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Diya 💖</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
  background: linear-gradient(135deg,#fff0f6,#ffd6e7,#ffc2d1,#ffd6e7);
  background-size:300% 300%;
  animation:bgFlow 12s ease infinite;
}

@keyframes bgFlow{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* SOFT LIGHT OVERLAY */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 60%);
  pointer-events:none;
}

/* FLOATING HEARTS */
.heart{
  position:absolute;
  width:12px;height:12px;
  background:#ff4d6d;
  transform:rotate(45deg);
  opacity:.2;
  filter:blur(.3px);
  animation:float 14s linear infinite;
}
.heart::before,.heart::after{
  content:"";
  position:absolute;
  width:12px;height:12px;
  background:#ff4d6d;
  border-radius:50%;
}
.heart::before{top:-6px;}
.heart::after{left:-6px;}

@keyframes float{
  0%{transform:translate3d(-10vw,100vh,0) rotate(45deg);}
  50%{transform:translate3d(10vw,40vh,0) rotate(45deg);}
  100%{transform:translate3d(-10vw,-10vh,0) rotate(45deg);}
}

/* SCREEN */
.screen{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  transform:scale(.94) translateY(30px);
  pointer-events:none;
  transition:all .65s cubic-bezier(.4,0,.2,1);
}
.screen.active{
  opacity:1;
  transform:scale(1) translateY(0);
  pointer-events:auto;
}

/* CARD (UPGRADED) */
.card{
  width:88%;
  max-width:360px;
  padding:32px 24px;
  border-radius:26px;
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(20px);
  box-shadow:
    0 15px 50px rgba(255,77,109,0.15),
    inset 0 1px 0 rgba(255,255,255,0.4);
  border:1px solid rgba(255,255,255,0.4);
  text-align:center;
  animation:cardIn .7s ease;
}

@keyframes cardIn{
  from{opacity:0; transform:scale(.9) translateY(20px);}
  to{opacity:1; transform:scale(1) translateY(0);}
}

p{
  font-size:15px;
  color:#444;
  line-height:1.6;
  margin:0;
}

/* BUTTON */
button{
  margin-top:22px;
  padding:12px 22px;
  border:none;
  border-radius:30px;
  background:linear-gradient(135deg,#ff4d6d,#ff85a2);
  color:white;
  font-size:14px;
  cursor:pointer;
  transition:.25s;
}
button:hover{
  transform:translateY(-2px) scale(1.03);
}
button:active{
  transform:scale(.92);
}

/* WHATSAPP CTA */
.wa{
  background:linear-gradient(135deg,#ff4d6d,#ff85a2);
  box-shadow:0 0 25px rgba(255,77,109,0.5);
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 12px rgba(255,77,109,.4);}
  50%{box-shadow:0 0 30px rgba(255,77,109,.9);}
  100%{box-shadow:0 0 12px rgba(255,77,109,.4);}
}
</style>

</head>

<body>

<script>
/* HEARTS */
for(let i=0;i<35;i++){
 let h=document.createElement("div");
 h.className="heart";
 h.style.left=Math.random()*100+"vw";
 h.style.animationDuration=(10+Math.random()*6)+"s";
 document.body.appendChild(h);
}
</script>

<div id="app"></div>

<script>
const texts = [
"hi diya… waittt 💭 don’t rush this",
"it’s been more than a month now… and somehow we got really close",
"and I won’t lie… this feels special to me",
"I like that we’re taking it slow… it actually makes it better",
"but I was thinking… 😌 maybe we move one tiny step forward",
"talking to you daily… yeah, it’s kind of my addiction now",
"and honestly… I just want more ways to annoy you",
"I know you’re not a call person… but the day we finally talk? yeah… that’s going to be special",
"I made this because… you’re way too special to me",
"and also because… I like finding new ways to make you smile and blush 😏"
];

let i=0;
const app=document.getElementById("app");

function render(){
 app.innerHTML = `
  <div class="screen active">
    <div class="card">
      <p>${texts[i]}</p>
      ${
        i<texts.length-1
        ? `<button onclick="next()">continue 💖</button>`
        : `<a href="https://wa.me/919205781271?text=hi%20babe">
            <button class="wa">prove it… text me 😌</button>
          </a>`
      }
    </div>
  </div>`;
}

function next(){
 i++;
 render();
}

render();
</script>

</body>
</html>
